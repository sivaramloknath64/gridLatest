services:
  selenium-hub:
    image: selenium/hub:4.48.0-20260905
    container_name: selenium-hub
    ports: 
    - "4444:4444" 
    environment:
    - SE_NODE_MAX_INSTANCES=5
    networks: 
    - selenium-grid

  chrome:
    image: selenium/node-chrome:4.48.0-20260905
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub  # Points to the selenium hub service by name
      - SE_EVENT_BUS_PUBLISH_PORT=4442  # Event bus publish port
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443  # Event bus subscribe port
      - SE_NODE_MAX_INSTANCES=5
      - SE_NODE_MAX_SESSIONS=5
    networks:
      - selenium-grid

networks:
  selenium-grid:
    driver: bridge  # A dedicated network for Selenium hub and nodes



